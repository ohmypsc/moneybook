<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>우리 가계부 - 연결 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f4ee;
      color: #15202b;
    }

    .app {
      width: min(100%, 480px);
      margin: 40px auto;
    }

    .card {
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .description {
      margin: 0 0 24px;
      color: #68717c;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #102235;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #f5f6f7;
      line-height: 1.7;
      word-break: break-word;
    }

    .success {
      background: #eef7f3 !important;
    }

    .error {
      background: #fff0ef !important;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="card">
      <h1>우리 가계부</h1>

      <p class="description">
        GitHub Pages와 Apps Script의 연결을 확인합니다.
      </p>

      <label for="apiUrl">
        Apps Script /exec 주소
      </label>

      <input
        id="apiUrl"
        type="url"
        placeholder="https://script.google.com/macros/s/.../exec"
      >

      <button id="testButton">
        연결 테스트
      </button>

      <div id="result">
        아직 테스트하지 않았습니다.
      </div>
    </div>
  </main>

  <script>
    const apiUrlInput = document.getElementById("apiUrl");
    const testButton = document.getElementById("testButton");
    const result = document.getElementById("result");

    testButton.addEventListener("click", testConnection);

    async function testConnection() {
      const apiUrl = apiUrlInput.value.trim();

      if (!apiUrl) {
        showError("Apps Script /exec 주소를 입력해주세요.");
        return;
      }

      result.className = "";
      result.textContent = "연결 중...";

      try {
        const healthResponse = await fetch(apiUrl, {
          method: "GET",
          redirect: "follow"
        });

        if (!healthResponse.ok) {
          throw new Error(
            `health HTTP 오류: ${healthResponse.status}`
          );
        }

        const health = await healthResponse.json();

        const bootstrapResponse = await fetch(
          `${apiUrl}?action=bootstrap`,
          {
            method: "GET",
            redirect: "follow"
          }
        );

        if (!bootstrapResponse.ok) {
          throw new Error(
            `bootstrap HTTP 오류: ${bootstrapResponse.status}`
          );
        }

        const bootstrap = await bootstrapResponse.json();

        if (!health.success || !bootstrap.success) {
          throw new Error("API가 success:false를 반환했습니다.");
        }

        const data = bootstrap.data;

        result.className = "success";

        result.innerHTML = `
          <strong>✅ 연결 성공</strong><br><br>

          API 버전:
          ${escapeHtml(health.apiVersion)}<br>

          서버 상태:
          ${escapeHtml(health.status)}<br><br>

          계좌:
          ${data.accounts.length}개<br>

          카테고리:
          ${data.categories.length}개<br>

          구성원:
          ${data.members.map(escapeHtml).join(", ")}<br>

          지출대상:
          ${data.spendingTargets.map(escapeHtml).join(", ")}
        `;

      } catch (error) {
        console.error(error);

        showError(
          `${error.name}: ${error.message}`
        );
      }
    }

    function showError(message) {
      result.className = "error";

      result.innerHTML = `
        <strong>❌ 연결 실패</strong><br><br>
        ${escapeHtml(message)}
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
