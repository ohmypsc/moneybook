<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#10273f"
  >

  <title>우리 가계부</title>

  <style>
    :root {
      --navy: #10273f;
      --navy-soft: #27445f;
      --sand: #f5f1e9;
      --card: #ffffff;
      --line: #e5e1da;
      --text: #17212b;
      --muted: #6d7680;
      --success-bg: #edf7f0;
      --success-text: #24623a;
      --error-bg: #fff0ee;
      --error-text: #9c342b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      background: var(--sand);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 24px;
      padding: 30px 26px;
      box-shadow:
        0 18px 50px
        rgba(16, 39, 63, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 30px;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
      color: var(--navy);
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--navy-soft);
      box-shadow:
        0 0 0 3px
        rgba(39, 68, 95, 0.10);
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .primary {
      margin-top: 22px;
      color: #fff;
      background: var(--navy);
    }

    .secondary {
      margin-top: 12px;
      color: var(--navy);
      background: #edf1f4;
    }

    .logout {
      margin-top: 12px;
      color: #5d6670;
      background: transparent;
      border: 1px solid var(--line);
    }

    .message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14px;
    }

    .message.info {
      color: var(--muted);
      background: #f5f6f7;
    }

    .message.success {
      color: var(--success-text);
      background: var(--success-bg);
    }

    .message.error {
      color: var(--error-text);
      background: var(--error-bg);
    }

    .user-box {
      margin: 24px 0 18px;
      padding: 18px;
      border-radius: 18px;
      background: var(--sand);
    }

    .user-name {
      margin-top: 4px;
      font-size: 23px;
      font-weight: 800;
      color: var(--navy);
    }

    .small {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .status {
      white-space: pre-wrap;
      word-break: keep-all;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="page">

    <section
      id="loginCard"
      class="card"
    >
      <h1>우리 가계부</h1>

      <p class="subtitle">
        우리 둘만 사용하는 공유 가계부
      </p>

      <form id="loginForm">

        <label for="name">
          이름
        </label>

        <input
          id="name"
          name="name"
          type="text"
          autocomplete="username"
          required
          autofocus
          placeholder="이름을 입력하세요"
        >

        <label for="password">
          비밀번호
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="비밀번호를 입력하세요"
        >

        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          로그인
        </button>

      </form>

      <div
        id="loginMessage"
        class="message info"
      >
        로그인 정보를 입력해주세요.
      </div>
    </section>


    <section
      id="appCard"
      class="card"
      hidden
    >
      <h1>우리 가계부</h1>

      <p class="subtitle">
        안전하게 연결되었습니다.
      </p>

      <div class="user-box">

        <div class="small">
          현재 사용자
        </div>

        <div
          id="userName"
          class="user-name"
        >
        </div>

        <div class="small">
          이 기기에서는 최대 90일 동안
          로그인 상태를 유지합니다.
        </div>

      </div>

      <button
        id="backendButton"
        class="primary"
        type="button"
      >
        보안 연결 확인
      </button>

      <div
        id="backendStatus"
        class="message info status"
      >
        로그인 성공
      </div>

      <button
        id="logoutButton"
        class="logout"
        type="button"
      >
        로그아웃
      </button>
    </section>

  </main>

  <script>
    const loginCard =
      document.getElementById(
        "loginCard"
      );

    const appCard =
      document.getElementById(
        "appCard"
      );

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const userName =
      document.getElementById(
        "userName"
      );

    const backendButton =
      document.getElementById(
        "backendButton"
      );

    const backendStatus =
      document.getElementById(
        "backendStatus"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    function setMessage(
      element,
      type,
      text
    ) {
      element.className =
        "message " +
        type;

      element.textContent =
        text;
    }


    function showLogin() {
      loginCard.hidden =
        false;

      appCard.hidden =
        true;
    }


    function showApp(
      name
    ) {
      loginCard.hidden =
        true;

      appCard.hidden =
        false;

      userName.textContent =
        name;
    }


    async function requestJson(
      url,
      options = {}
    ) {
      const response =
        await fetch(
          url,
          {
            credentials:
              "include",

            ...options
          }
        );

      let data;

      try {
        data =
          await response.json();

      } catch (error) {
        throw new Error(
          "서버 응답을 읽을 수 없습니다."
        );
      }

      return {
        response,
        data
      };
    }


    async function checkSession() {
      try {
        const {
          response,
          data
        } =
          await requestJson(
            "/api/auth/session"
          );

        if (
          response.ok &&
          data.success &&
          data.loggedIn
        ) {
          showApp(
            data.user.name
          );

          return;
        }

      } catch (error) {
        console.error(
          error
        );
      }

      showLogin();
    }


    loginForm.addEventListener(
      "submit",

      async event => {
        event.preventDefault();

        const name =
          document
            .getElementById(
              "name"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "password"
            )
            .value;

        loginButton.disabled =
          true;

        loginButton.textContent =
          "로그인 중...";

        setMessage(
          loginMessage,
          "info",
          "로그인을 확인하고 있습니다."
        );

        try {
          const {
            response,
            data
          } =
            await requestJson(
              "/api/auth/login",
              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    name,
                    password
                  })
              }
            );

          if (
            !response.ok ||
            !data.success
          ) {
            throw new Error(
              data.error &&
              data.error.message
                ? data.error.message
                : "로그인에 실패했습니다."
            );
          }

          document
            .getElementById(
              "password"
            )
            .value =
            "";

          showApp(
            data.user.name
          );

          setMessage(
            backendStatus,
            "success",
            "로그인 성공"
          );

        } catch (error) {
          setMessage(
            loginMessage,
            "error",
            error.message
          );

        } finally {
          loginButton.disabled =
            false;

          loginButton.textContent =
            "로그인";
        }
      }
    );


    backendButton.addEventListener(
      "click",

      async () => {
        backendButton.disabled =
          true;

        backendButton.textContent =
          "확인 중...";

        setMessage(
          backendStatus,
          "info",
          "Apps Script와 연결을 확인하고 있습니다."
        );

        try {
          const {
            response,
            data
          } =
            await requestJson(
              "/api/backend-test"
            );

          if (
            !response.ok ||
            !data.success
          ) {
            throw new Error(
              data.error &&
              data.error.message
                ? data.error.message
                : "연결 확인에 실패했습니다."
            );
          }

          const counts =
            data.counts ||
            {};

          setMessage(
            backendStatus,
            "success",
            [
              "모든 보안 연결이 정상입니다.",
              "",
              "API: " +
                data.apiVersion,
              "계좌: " +
                (counts.accounts ?? 0),
              "카테고리: " +
                (counts.categories ?? 0),
              "구성원: " +
                (counts.members ?? 0),
              "지출대상: " +
                (counts.spendingTargets ?? 0)
            ].join(
              "\n"
            )
          );

        } catch (error) {
          setMessage(
            backendStatus,
            "error",
            error.message
          );

        } finally {
          backendButton.disabled =
            false;

          backendButton.textContent =
            "보안 연결 확인";
        }
      }
    );


    logoutButton.addEventListener(
      "click",

      async () => {
        try {
          await requestJson(
            "/api/auth/logout",
            {
              method:
                "POST"
            }
          );

        } finally {
          location.reload();
        }
      }
    );


    checkSession();
  </script>
</body>
</html>
